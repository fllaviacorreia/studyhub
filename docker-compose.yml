services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studyhub
      POSTGRES_USER: studyhub
      POSTGRES_PASSWORD: studyhub
    ports:
      - "5432:5432"
    volumes:
      - studyhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhub -d studyhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  studyhub_postgres_data:
